<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#1d2733; --muted:#5b6b7f; --line:#dde4ec;
  --brand:#0f6f5c; --brand-ink:#ffffff; --accent:#0b5cad;
  --ok-bg:#e7f5ee; --ok-ink:#0f6f5c; --warn-bg:#fdf0e3; --warn-ink:#a15c0a;
  --chip:#eef2f7; --row-hover:#f0f5fa; --done:#8796a8; --shadow:0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161f; --panel:#1a2230; --ink:#e8edf4; --muted:#93a1b3; --line:#2b3648;
    --brand:#2fae90; --brand-ink:#08110d; --accent:#5aa2e0;
    --ok-bg:#12312a; --ok-ink:#63cfae; --warn-bg:#3a2a12; --warn-ink:#e8b36b;
    --chip:#232e40; --row-hover:#202b3c; --done:#5c6a7d; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#10161f; --panel:#1a2230; --ink:#e8edf4; --muted:#93a1b3; --line:#2b3648;
  --brand:#2fae90; --brand-ink:#08110d; --accent:#5aa2e0;
  --ok-bg:#12312a; --ok-ink:#63cfae; --warn-bg:#3a2a12; --warn-ink:#e8b36b;
  --chip:#232e40; --row-hover:#202b3c; --done:#5c6a7d; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:12px}
h1{font-size:20px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi .val{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .det{font-size:12px;color:var(--muted)}
.kpi.g .val{color:var(--ok-ink)} .kpi.n .val{color:var(--warn-ink)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
.tab.active{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.filters input[type=text],.filters select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
.filters input[type=text]{flex:1;min-width:180px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.summary{display:flex;flex-wrap:wrap;gap:6px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13px}
.summary b{font-variant-numeric:tabular-nums}
.summary .prog{color:var(--muted)}
.tblbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px}
th{position:sticky;top:0;background:var(--panel);z-index:1;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{background:var(--chip);font-weight:700;cursor:pointer;user-select:none}
tr.grp .cnt{color:var(--muted);font-weight:500;font-size:12px}
tr.grp .caret{display:inline-block;width:14px;transition:transform .15s}
@media (prefers-reduced-motion: reduce){ tr.grp .caret{transition:none} }
tr.grp.closed .caret{transform:rotate(-90deg)}
tr.det:hover td{background:var(--row-hover)}
tr.det.done td{color:var(--done)}
tr.det.done td .strike{text-decoration:line-through}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;font-size:11.5px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.cli{color:var(--muted);font-size:12px}
.mono{font-family:"IBM Plex Mono",Consolas,monospace;font-size:12.5px;white-space:nowrap}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{margin:14px 0 6px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:640px){ h1{font-size:17px} .kpi .val{font-size:17px} }
</style>

ns":"D\u0026C VALPARAÍSO","nave":"TBN - WSA","fcd":"2026-06-06","fzp":"2026-06-09","femb":"2026-06-09","sem":"24","bk":"","ges":"Despacho Regular / Sin Alerta"},{"grp":"G","ped":"OE00468174","pos":"1","cli":"EURPACK GIUSTINI SACCHETT","pais":"Italia","pto":"Livorno","prod":"SKID MAULE GC2 250 GR NO","pl":"MA1","ton":4.856,"ma":0.347,"va":0,"cons":"PTO COLUMBO VAP","nave":"MSC RAYSHMI","fcd":"2026-05-25","fzp":"2026-05-31","femb":"2026-06-02","sem":"23","bk":"EBKG16970869","ges":"Gestionar Saldo"},{"grp":"G","ped":"OE00468564","pos":"2","cli":"MOQUIN PRESS","pais":"EE.UU.","pto":"Los Angeles","prod":"SKID MAULE RC NS 285 GR NO","pl":"MA1","ton":33.173,"ma":0.217,"va":0,"cons":"PTO COLUMBO VAP","nave":"MSC RAYSHMI","fcd":"2026-05-27","fzp":"2026-05-31","femb":"2026-06-02","sem":"23","bk":"EBKG16909225","ges":"Gestionar Saldo"},{"grp":"G","ped":"OE00468174","pos":"2","cli":"EURPACK GIUSTINI SACCHETT","pais":"Italia","pto":"Livorno","prod":"SKID MAULE GC2 250 GR NO","pl":"MA1","ton":6.168,"ma":0.441,"va":0,"cons":"PTO COLUMBO VAP","nave":"MSC RAYSHMI","fcd":"2026-05-25","fzp":"2026-05-31","femb":"2026-06-02","sem":"23","bk":"EBKG16970869","ges":"Gestionar Saldo"}];
let TAB = 'G';
let CHECKS = {};
try { CHECKS = JSON.parse(localStorage.getItem('cruceChecks') || '{}'); } catch(e) { CHECKS = {}; }
function saveChecks(){ try { localStorage.setItem('cruceChecks', JSON.stringify(CHECKS)); } catch(e){} }

const nf = new Intl.NumberFormat('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1});
const fmt = t => nf.format(t);
function fdate(s){ if(!s || s.length < 10) return '—'; return s.slice(8,10) + '-' + s.slice(5,7); }
function rid(r){ return r.ped + '_' + r.pos; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function kpis(){
  const s = {G:{ma:0,va:0,n:0}, N:{ma:0,va:0,n:0}};
  DATA.forEach(r => { s[r.grp].ma += r.ma; s[r.grp].va += r.va; s[r.grp].n++; });
  document.getElementById('kpis').innerHTML =
    `<div class="kpi g"><div class="lbl">Gestionada · Maule</div><div class="val">${fmt(s.G.ma)} t</div><div class="det">${s.G.n} posiciones en total</div></div>` +
    `<div class="kpi g"><div class="lbl">Gestionada · Valdivia</div><div class="val">${fmt(s.G.va)} t</div><div class="det">con nave asignada</div></div>` +
    `<div class="kpi n"><div class="lbl">No gestionada · Maule</div><div class="val">${fmt(s.N.ma)} t</div><div class="det">${s.N.n} posiciones en total</div></div>` +
    `<div class="kpi n"><div class="lbl">No gestionada · Valdivia</div><div class="val">${fmt(s.N.va)} t</div><div class="det">pendiente asignar nave</div></div>`;
}

function fillSelect(id, label, values){
  const sel = document.getElementById(id);
  const cur = sel.value;
  sel.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if (values.includes(cur)) sel.value = cur;
}

function baseRows(){ return DATA.filter(r => r.grp === TAB); }

function filteredRows(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const pl = document.getElementById('fPl').value;
  const cons = document.getElementById('fCons').value;
  const dim = document.getElementById('fDim').value;
  const rev = document.getElementById('fRev').value;
  return baseRows().filter(r => {
    if (pl === 'ma' && r.ma <= 0) return false;
    if (pl === 'va' && r.va <= 0) return false;
    if (cons && r.cons !== cons) return false;
    if (dim && (TAB === 'G' ? r.nave : r.pais) !== dim) return false;
    if (rev === 'p' && CHECKS[rid(r)]) return false;
    if (rev === 'r' && !CHECKS[rid(r)]) return false;
    if (q){
      const hay = (r.ped + ' ' + r.cli + ' ' + r.prod + ' ' + r.nave + ' ' + r.pais + ' ' + r.cons + ' ' + r.bk).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function setTab(t){
  TAB = t;
  document.getElementById('tabG').classList.toggle('active', t === 'G');
  document.getElementById('tabN').classList.toggle('active', t === 'N');
  refreshSelects();
  render();
}

function refreshSelects(){
  const rows = baseRows();
  fillSelect('fCons', 'Consolidador: todos', [...new Set(rows.map(r => r.cons))].sort());
  if (TAB === 'G') fillSelect('fDim', 'Nave: todas', [...new Set(rows.map(r => r.nave))].sort());
  else fillSelect('fDim', 'País: todos', [...new Set(rows.map(r => r.pais))].sort());
}

function clearFilters(){
  document.getElementById('q').value = '';
  ['fPl','fCons','fDim','fRev'].forEach(id => document.getElementById(id).value = '');
  render();
}

function toggleCheck(id){
  if (CHECKS[id]) delete CHECKS[id]; else CHECKS[id] = 1;
  saveChecks();
  render();
}

function clearChecks(){
  if (!confirm('¿Reiniciar todas las marcas de revisado de esta pestaña?')) return;
  baseRows().forEach(r => delete CHECKS[rid(r)]);
  saveChecks();
  render();
}

function toggleGrp(key){
  const rowsEls = document.querySelectorAll(`tr[data-g="${CSS.escape(key)}"]`);
  const head = document.querySelector(`tr.grp[data-k="${CSS.escape(key)}"]`);
  const closed = head.classList.toggle('closed');
  rowsEls.forEach(el => el.style.display = closed ? 'none' : '');
}

function render(){
  const rows = filteredRows();
  let ma = 0, va = 0, done = 0;
  rows.forEach(r => { ma += r.ma; va += r.va; if (CHECKS[rid(r)]) done++; });
  document.getElementById('summary').innerHTML =
    `<span>Posiciones: <b>${rows.length}</b></span>` +
    `<span>Maule: <b>${fmt(ma)} t</b></span>` +
    `<span>Valdivia: <b>${fmt(va)} t</b></span>` +
    `<span>Total: <b>${fmt(ma + va)} t</b></span>` +
    `<span class="prog">Revisadas: <b>${done}/${rows.length}</b></span>`;

  if (!rows.length){
    document.getElementById('tbl').innerHTML = '<div class="empty">Sin resultados con los filtros actuales.</div>';
    return;
  }

  const key = TAB === 'G' ? (r => r.nave) : (r => r.pais);
  const groups = {};
  rows.forEach(r => { const k = key(r); (groups[k] = groups[k] || []).push(r); });
  const gkeys = Object.keys(groups).sort();

  let h = '<table><thead><tr>';
  if (TAB === 'G'){
    h += '<th>Nave / Pedido</th><th>Cliente</th><th>País</th><th>Producto</th><th>Consolidador</th><th>Corte doc.</th><th>Zarpe plan</th><th class="num">Maule t</th><th class="num">Valdivia t</th><th>✓</th>';
  } else {
    h += '<th>País / Pedido</th><th>Cliente</th><th>Producto</th><th>Servicio (TBN)</th><th>Mover a</th><th>Zarpe plan</th><th class="num">Maule t</th><th class="num">Valdivia t</th><th>✓</th>';
  }
  h += '</tr></thead><tbody>';

  const cols = TAB === 'G' ? 10 : 9;
  gkeys.forEach(k => {
    const g = groups[k];
    let gm = 0, gv = 0; g.forEach(r => { gm += r.ma; gv += r.va; });
    const conss = [...new Set(g.map(r => r.cons))].join(' · ');
    const dates = TAB === 'G' ? [...new Set(g.map(r => fdate(r.fcd)))].join(', ') : [...new Set(g.map(r => fdate(r.fzp)))].join(', ');
    const dLbl = TAB === 'G' ? 'corte' : 'zarpe';
    h += `<tr class="grp" data-k="${esc(k)}" onclick="toggleGrp('${esc(k).replace(/'/g, "\\'")}')"><td colspan="${cols - 3}"><span class="caret">▾</span>${esc(k)} <span class="cnt">· ${g.length} pos · ${esc(conss)} · ${dLbl}: ${dates}</span></td><td class="num">${fmt(gm)}</td><td class="num">${fmt(gv)}</td><td></td></tr>`;
    g.sort((a, b) => (TAB === 'G' ? (a.fcd + a.ped).localeCompare(b.fcd + b.ped) : (a.fzp + a.ped).localeCompare(b.fzp + b.ped)));
    g.forEach(r => {
      const id = rid(r), ck = CHECKS[id] ? 'checked' : '';
      const pill = TAB === 'G' ? `<span class="pill ok">${esc(r.cons)}</span>` : `<span class="pill warn">${esc(r.cons)}</span>`;
      h += `<tr class="det ${ck ? 'done' : ''}" data-g="${esc(k)}" title="${esc(r.ges)} · ${esc(r.pto)} · planta ${esc(r.pl)}">`;
      if (TAB === 'G'){
        h += `<td class="mono strike">${esc(r.ped)}-${esc(r.pos)}</td><td><span class="strike">${esc(r.cli)}</span></td><td>${esc(r.pais)}</td><td class="cli">${esc(r.prod)}</td><td>${pill}</td><td class="mono">${fdate(r.fcd)}</td><td class="mono">${fdate(r.fzp)}</td>`;
      } else {
        h += `<td class="mono strike">${esc(r.ped)}-${esc(r.pos)}</td><td><span class="strike">${esc(r.cli)}</span></td><td class="cli">${esc(r.prod)}</td><td class="cli">${esc(r.nave).replace('TBN - ','')}</td><td>${pill}</td><td class="mono">${fdate(r.fzp)}</td>`;
      }
      h += `<td class="num">${r.ma > 0 ? fmt(r.ma) : '—'}</td><td class="num">${r.va > 0 ? fmt(r.va) : '—'}</td>` +
           `<td><input type="checkbox" ${ck} onchange="toggleCheck('${id}')"></td></tr>`;
    });
  });
  h += '</tbody></table>';
  document.getElementById('tbl').innerHTML = h;
}

async function exportCSV(){
  const rows = filteredRows();
  const dec = n => String(n.toFixed(3)).replace('.', ',');
  const head = TAB === 'G'
    ? ['Nave','Pedido','Pos','Cliente','Pais','Producto','Consolidador','Fecha corte doc','Fecha zarpe plan','Maule t','Valdivia t','Revisado']
    : ['Pais','Pedido','Pos','Cliente','Producto','Servicio TBN','Mover a consolidador','Fecha zarpe plan','Maule t','Valdivia t','Revisado'];
  const lines = [head.join(';')];
  rows.forEach(r => {
    const rev = CHECKS[rid(r)] ? 'SI' : 'NO';
    const cells = TAB === 'G'
      ? [r.nave, r.ped, r.pos, r.cli, r.pais, r.prod, r.cons, r.fcd, r.fzp, dec(r.ma), dec(r.va), rev]
      : [r.pais, r.ped, r.pos, r.cli, r.prod, r.nave, r.cons, r.fzp, dec(r.ma), dec(r.va), rev];
    lines.push(cells.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';'));
  });
  const name = (TAB === 'G' ? 'carga_gestionada' : 'carga_no_gestionada') + '_2026-08-27';
  const content = '﻿' + lines.join('\r\n');
  if (typeof window.claude !== 'undefined' && window.claude.use){
    const dl = await claude.use('downloads');
    if (dl){
      try { await dl.save({filename: name + '.csv', data: content}); }
      catch(e){
        if (e && e.code === 'extension_not_enabled'){
          try { await dl.save({filename: name + '.txt', data: content}); } catch(e2){}
        }
      }
      return;
    }
  }
  const blob = new Blob([content], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

kpis();
setTab('G');
</script>
